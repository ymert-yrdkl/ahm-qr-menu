server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /medya/ {
    expires 30d;
    add_header Cache-Control "public";
  }
  location /fonts/ {
    expires 365d;
    add_header Cache-Control "public, immutable";
  }
  # menü istatistiği yalnız ahmcloud.com/m/ altında toplanır; burada sessizce kabul edilir
  location /api/ {
    return 204;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # /menu ve /menu#urun adresleri de aynı sayfayı açar
  location / {
    try_files $uri /index.html;
  }
}
