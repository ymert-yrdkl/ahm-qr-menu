<html lang="tr" data-diller="{{DILLER}}">

<meta charset="utf-8">

<meta name="robots" content="noindex">

<!-- kapak fotoğrafı betiği beklemeden, ekrana uygun boyutta ve en yüksek öncelikle iner (LCP) -->

<meta property="og:title" content="{{TITLE}}">

<!--
  Yıldızkart QR menü — v8: TEK SAYFA, yay fiziği, parmağa bağlı katmanlar.
  (v7 iki ayrı sayfaydı: sablon-v7.html + sablon-menu-v7.html)

  Neden: iki sayfa arasında her "Menüyü aç" yeni bir yükleme demekti; geçiş
  animasyonu yalnız bunu örtüyordu, yarıda durdurulamaz, parmağı izlemezdi.
  Artık:
  · Menü, açılışın üstüne alttan gelen bir YAPRAK (iOS kart yığını). Açılış
    geri çekilip kararır; ikisi aynı ilerleme değerine bağlı.
  · Bütün hareket bir YAY benzetimi (k=420, c=40 → hafif, kontrollü sönüm):
    hız korunur, hareket yarıda yakalanıp tersine çevrilebilir.
  · Yapraklar parmağı izler: aşağı çek → kapanır ya da yaylanır (savrulma tahmini
    y + v·150 ms > %28 ya da hız > 0,5 px/ms); yukarı çekişte lastik direnci; içerik kaydırılmışken
    çekmek önce kaydırır (iOS davranışı).
  · Ürün paneli: dokunulan küçük görsel yayla panelin görseline UÇAR (klon +
    kırpma); dokunma anında büyük görsel indirilmeye başlar.
  · Geçmiş: her katman bir history girdisi; Android geri / iOS kenar kaydırma
    üstteki katmanı kapatır. /menu adresi menü açık başlar.
  · Yalnız transform/opacity; hareketi azalt → yay yerine anında.
-->
<style>
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url(/assets/fonts/Jost-400.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:500;font-display:swap;src:url(/assets/fonts/Jost-500.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:600;font-display:swap;src:url(/assets/fonts/Jost-600.woff2) format("woff2")}

:root{
  --zemin:#FAFAF8; --yazi:#151514; --baslik:"Jost", system-ui, sans-serif; --logo:currentColor; --soluk:#62625C; --cizgi:rgba(21,21,20,.1); --dolgu:#ECEAE4;
  --vurgu:{{VURGU}}; --vurgu-acik:{{VURGU_ACIK}}; --kapali:#A1392B; --uyari:#8A5A00;
  /* metin olarak vurgu (koyu zeminde açılır); düğme zemini hep --vurgu */
  --vurgu-yazi:{{VURGU}}; --basili:rgba(21,21,20,.035); --tutamac-renk:rgba(21,21,20,.18); --kutu:#fff; --ipucu:#6E6E67; --foto-bos:#E9E7E1;
  --cikis:cubic-bezier(.16,1,.3,1);
  --ust:calc(env(safe-area-inset-top) + 10px);
}
*{box-sizing:border-box; margin:0}
[hidden]{display:none !important}   /* .urun{display:grid} gibi kurallar hidden özniteliğini ezmesin */
html{-webkit-text-size-adjust:100%; background:var(--zemin); color-scheme:only light}
/* ── Gece modu: aynı işletme, koyu zeminde. Vurgu metinleri ≥ 4,8:1 okunacak kadar açılır (uret.koyu_palet). */
html.gece{
  --zemin:#1D1D1C; --yazi:#EDEBE6; --soluk:#A6A49C; --cizgi:rgba(237,235,230,.12); --dolgu:#2B2A27;
  --vurgu-yazi:{{GECE_YAZI}}; --vurgu-acik:{{GECE_ACIK}}; --kapali:#EE8B7E; --uyari:#E4B55E;
  --basili:rgba(255,255,255,.05); --tutamac-renk:rgba(237,235,230,.28); --kutu:#262522; --ipucu:#9B998F; --foto-bos:#2B2A27;
  color-scheme:dark;
}
/* tema değişirken renkler yumuşakça geçsin (yalnız renk özellikleri; hareket etkilenmez) */
html.gecis, html.gecis *{transition:background-color 320ms var(--cikis), color 320ms var(--cikis), border-color 320ms var(--cikis), fill 320ms var(--cikis) !important}
html.katmanli, html.katmanli body{background:#151514}   /* açılış geri çekilince kenarlar koyu (iOS kart yığını) */
body{font-family:"Jost",system-ui,sans-serif; color:var(--yazi); background:#151514; font-size:17px; line-height:1.5;
  -webkit-font-smoothing:antialiased; font-synthesis:none; overflow-x:hidden; overflow-x:clip; caret-color:var(--vurgu-yazi)}
body{background:var(--zemin)}
/* hızlı iki dokunuş yakınlaştırmasın; parmakla yakınlaştırma (erişilebilirlik) serbest */
button, a, summary, input{touch-action:manipulation}
html.kilit, html.kilit body{overflow:hidden}
::selection{background:var(--vurgu-acik); color:var(--yazi)}
:focus-visible{outline:2px solid var(--vurgu-yazi); outline-offset:2px; border-radius:4px}
/* dokunarak kullanan birine, katman kapanınca geri verilen odağın halkası görünmesin (Tab ile gezinene görünür) */
html.dokunmatik :focus-visible:not(input){outline:none}
.ph{width:1em; height:1em; flex:none; display:block}
img{display:block}
button{font:inherit; color:inherit}

/* ══════════════════ AÇILIŞ ══════════════════ */
#kok{background:var(--zemin); min-height:100vh; min-height:100dvh; padding-bottom:calc(56px + 28px + env(safe-area-inset-bottom));
  transform-origin:50% 50%}
.sayfa{max-width:520px; margin:0 auto; position:relative}
/* kapağın köşesinde: dil + gece (turist kapıdan girer girmez görsün) */
.ust-araclar{position:absolute; z-index:5; top:calc(env(safe-area-inset-top) + 12px); inset-inline-end:12px; display:flex; gap:8px}
.cip-grup{display:flex; height:44px; padding:0 4px; border-radius:22px; align-items:center;
  background:color-mix(in srgb, var(--zemin) 86%, transparent); -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 1px 8px rgba(0,0,0,.12)}
.cip-grup button{height:36px; min-width:44px; padding:0 10px; border:0; border-radius:18px; background:none; cursor:pointer; color:var(--soluk);
  font-size:14px; font-weight:500; -webkit-tap-highlight-color:transparent; transition:background-color 180ms var(--cikis), color 180ms var(--cikis)}
.cip-grup button[data-dil][aria-pressed="true"]{background:var(--yazi); color:var(--zemin)}
.cip-grup.tek{padding:0; width:44px; justify-content:center}
.cip-grup.tek button{width:44px; height:44px; min-width:0; padding:0; display:grid; place-items:center; color:var(--yazi)}
.gece-dugme .ph{font-size:20px}
.gece-dugme .gunes{display:none} html.gece .gece-dugme .gunes{display:block} html.gece .gece-dugme .ay{display:none}
.foto{position:relative; height:44vh; height:44dvh; min-height:260px; max-height:460px; background:var(--foto-bos); overflow:hidden}
.foto .katman{position:absolute; inset:0}
.foto img, .foto video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
/* Bulanık önizleme ÜSTTE durur ve keskin fotoğraf inince kaybolur. Tersi (fotoğrafın opaklıkla belirmesi)
   Chrome'un LCP'sini animasyon süresi kadar (~0,7 sn) geciktiriyordu. */
.foto .onizleme{filter:blur(18px); transform:scale(1.12); z-index:1; transition:opacity 700ms var(--cikis)}
.foto .katman.hazir .onizleme{opacity:0}
.foto video{opacity:0; z-index:2; transition:opacity 600ms var(--cikis)}
.foto video.hazir{opacity:1}
@supports (animation-timeline: scroll()){
  @media (prefers-reduced-motion: no-preference){
    .foto .katman{animation:derinlik linear both; animation-timeline:scroll(root); animation-range:0 55vh}
    @keyframes derinlik{to{transform:translateY(16%) scale(1.06); filter:brightness(.9)}}
  }
}
.kimlik{padding:22px 20px 18px}
@media (orientation: landscape) and (max-height: 500px){ .foto{min-height:0; height:62vh; height:62dvh} }
.kimlik h1{font-family:var(--baslik); font-size:clamp(34px, 9.6vw, 42px); font-weight:600; line-height:1.08; letter-spacing:-.02em; text-wrap:balance}
/* logo yuvası: vektör logo işletme adının yerine geçer (ad, ekran okuyucu için aria-label'da) */
.kimlik h1.logolu{line-height:0}
.kimlik h1.logolu svg{display:block; height:clamp(44px, 12vw, 58px); width:auto; color:var(--logo)}
.serifli .kimlik h1:not(.logolu), .serifli .m-bas h2, .serifli .bolum h3, .serifli .u-govde h3, .serifli .oneri h3{letter-spacing:0; font-weight:600}
.serifli .m-bas h2{font-size:clamp(38px, 10.5vw, 46px)}
.serifli .bolum h3{font-size:25px}
.serifli .u-govde h3{font-size:29px}
.serifli .oneri h3{font-family:var(--baslik); font-size:19px; color:var(--yazi)}
.durum{margin-top:8px; display:flex; align-items:center; gap:8px; color:var(--soluk); font-size:16px}
.durum i{width:8px; height:8px; border-radius:50%; background:var(--vurgu-yazi); flex:none}
.durum b{font-weight:500; color:var(--vurgu-yazi)}
.durum.kapali i{background:var(--kapali)} .durum.kapali b{color:var(--kapali)}
.durum.yakinda i{background:var(--uyari)} .durum.yakinda b{color:var(--uyari)}
.satirlar{border-top:1px solid var(--cizgi); margin:0 20px}
.satir{display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:14px; min-height:64px; padding:12px 0;
  border:0; border-bottom:1px solid var(--cizgi); color:inherit; text-decoration:none; text-align:start; background:none; width:100%;
  cursor:pointer; -webkit-tap-highlight-color:transparent; transition:background-color 120ms var(--cikis)}
.satir:active{background:var(--basili)}
.satir > .ph{font-size:22px}
.satir strong{display:block; font-weight:500; font-size:17px; line-height:1.3; text-wrap:pretty}
.satir small{display:block; color:var(--soluk); font-size:15px; line-height:1.35; margin-top:1px; text-wrap:pretty}
.satir .yon{font-size:18px; color:var(--soluk); transition:transform 220ms var(--cikis)}
a.satir:active .yon{transform:translate(2px,-2px)}

@media (hover:hover){ a.satir:hover .yon{transform:translate(2px,-2px)} }
.eylem{font-size:15px; font-weight:500; color:var(--vurgu-yazi); display:flex; align-items:center; gap:6px; white-space:nowrap}
.sifre{font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.01em}
.wifi{position:relative; isolation:isolate}
.wifi::before{content:""; position:absolute; inset:0 -20px; z-index:-1; background:var(--vurgu-acik); opacity:0; transition:opacity 1200ms var(--cikis)}
.wifi.tamam::before{opacity:1; transition-duration:120ms}
.cizgi-tik{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.cizgi-tik path{stroke-dasharray:24; stroke-dashoffset:24}
.wifi.tamam .cizgi-tik path{stroke-dashoffset:0; transition:stroke-dashoffset 360ms var(--cikis) 60ms}
.wifi .eylem span{display:inline-block; transition:opacity 150ms var(--cikis), transform 150ms var(--cikis)}
.wifi .eylem .tik{display:none}
.wifi.tamam .eylem .tik{display:inline-block}
.wifi.degisiyor .eylem span{opacity:0; transform:translateY(3px)}
#wifi-ag{transition:opacity 150ms; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
details.satir{display:block; padding:0; cursor:default}
details summary{list-style:none; display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:14px; min-height:64px; padding:12px 0; cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary .yon{transition:transform 220ms var(--cikis)}
details[open] summary .yon{transform:rotate(180deg)}
.hafta{display:grid; grid-template-columns:1fr auto; gap:6px 16px; padding-block:0 16px; padding-inline:38px 0; font-size:15.5px; font-variant-numeric:tabular-nums}
.hafta dt{color:var(--soluk)} .hafta dd{text-align:end}
.hafta .bugun{color:var(--yazi); font-weight:500}
.son{padding:28px 20px 8px; color:var(--soluk); font-size:13.5px; display:flex; justify-content:space-between; gap:12px}
/* başparmak bölgesi: menü açıldıkça aşağı çekilir (JS, aynı ilerleme değeri) */
.alt{position:fixed; left:0; right:0; bottom:0; z-index:10; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--zemin) 62%, color-mix(in srgb, var(--zemin) 0%, transparent))}
.menu-ac{max-width:488px; margin:0 auto; height:56px; width:100%; border:0; border-radius:12px; background:var(--vurgu); color:#fff; cursor:pointer;
  display:flex; align-items:center; gap:10px; padding:0 18px; font-size:18px; font-weight:500; letter-spacing:-.005em; -webkit-tap-highlight-color:transparent;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 8px 20px -10px color-mix(in srgb, var(--vurgu) 55%, transparent); transition:transform 100ms var(--cikis), background-color 150ms}
.menu-ac .ph{font-size:20px}
.menu-ac .sayi{margin-inline-start:auto; font-size:15px; font-weight:400; opacity:.72; font-variant-numeric:tabular-nums}
.menu-ac:active{transform:scale(.985); background:color-mix(in srgb, var(--vurgu) 86%, #000)}
/* yatay iPhone: çentik tarafı */
.alt{padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
@media (prefers-reduced-motion: no-preference){
  .gir{opacity:0; transform:translateY(8px); animation:gir 420ms var(--cikis) forwards; animation-delay:calc(var(--i, 0) * 60ms)}
  @keyframes gir{to{opacity:1; transform:none}}
}

/* ══════════════════ KATMANLAR ══════════════════ */
/* Kapalıyken display:none — Safari 26 üst çubuk rengini üst kenara değen sabit öğelerden örnekler;
   saydam ama duran bir koyu perde, menü kapandıktan sonra da çubuğu koyu bırakıyordu. */
.perde{position:fixed; inset:0; background:#151514; opacity:0; pointer-events:none; display:none}
.perde.var{display:block}
.perde.etkin{pointer-events:auto}
#perde1{z-index:20} #perde2{z-index:40}
.yaprak{position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:560px; background:var(--zemin); visibility:hidden;
  border-radius:14px 14px 0 0; box-shadow:0 -10px 40px rgba(21,21,20,.18); transform:translate3d(0,100%,0); will-change:transform;
  display:flex; flex-direction:column; overflow:hidden; touch-action:pan-y}
.yaprak.gorunur{visibility:visible}
#menuYaprak{z-index:30; top:var(--ust)}
#urunYaprak{z-index:50; max-height:calc(100vh - var(--ust) - 24px); max-height:calc(100dvh - var(--ust) - 24px)}
.tutamac{flex:none; display:grid; place-items:center; height:22px; cursor:grab; touch-action:none}
.tutamac::before{content:""; width:40px; height:5px; border-radius:3px; background:var(--tutamac-renk)}
.kaydir{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}

/* ── menü yaprağı ── */
.m-ust{flex:none; background:var(--zemin); position:relative; z-index:2; transition:box-shadow 220ms var(--cikis); touch-action:none}
.m-ust.golgeli{box-shadow:0 1px 0 var(--cizgi)}
.m-satir{display:grid; grid-template-columns:96px 1fr 96px; align-items:center; height:48px; padding:0 8px}
.m-sag{display:flex; justify-content:flex-end}
.dugme{width:48px; height:48px; display:grid; place-items:center; border-radius:12px; background:none; border:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:background-color 120ms}
.dugme:active{background:var(--basili)}
.dugme.gece-dugme .ph{font-size:21px}
.dugme .ph{font-size:22px}
.m-baslik{text-align:center; font-weight:500; font-size:16px; line-height:1.2; opacity:0; transform:translateY(6px);
  transition:opacity 220ms var(--cikis), transform 320ms var(--cikis)}
.m-ust.golgeli .m-baslik{opacity:1; transform:none}
.m-baslik .m-logo{display:flex; justify-content:center; line-height:0} .m-baslik .m-logo svg{height:19px; width:auto; color:var(--logo)}
.m-baslik:has(.m-logo) small{margin-top:3px}
.m-baslik small{display:block; font-weight:400; font-size:13px; color:var(--soluk)}
.ara{display:none; padding:4px 16px 10px}
.ara.acik{display:block}
.ara input{width:100%; height:48px; border-radius:12px; border:1px solid var(--cizgi); background:var(--kutu); padding:0 16px;
  font:inherit; font-size:17px; color:var(--yazi); outline:none; transition:border-color 150ms; touch-action:manipulation}
.ara input:focus{border-color:var(--vurgu-yazi)}
.ara input::placeholder{color:var(--ipucu)}
.ara input::-webkit-search-cancel-button{-webkit-appearance:none; display:none}
.sekmeler{position:relative; display:flex; gap:22px; overflow-x:auto; padding:0 20px; scrollbar-width:none; border-bottom:1px solid var(--cizgi); touch-action:pan-x}
.sekmeler::-webkit-scrollbar{display:none}
.sekme{flex:none; height:46px; display:flex; align-items:center; background:none; border:0; padding:0; cursor:pointer;
  color:var(--soluk); font-size:16px; font-weight:500; white-space:nowrap; -webkit-tap-highlight-color:transparent; transition:color 150ms}
.sekme[aria-current="true"]{color:var(--yazi)}
.isaret{position:absolute; left:0; bottom:0; width:100px; height:2px; border-radius:2px; background:var(--vurgu-yazi);
  transform-origin:0 50%; transform:translateX(var(--x, 20px)) scaleX(var(--o, 0)); pointer-events:none}
.isaret.hazir{transition:transform 360ms var(--cikis)}
.m-bas{padding:18px 20px 4px}
.m-bas h2{font-family:var(--baslik); font-size:clamp(34px, 9.6vw, 42px); font-weight:600; line-height:1.08; letter-spacing:-.02em}
.m-bas p{margin-top:6px; color:var(--soluk); font-size:15px}
.oneri{padding-top:22px}
.oneri h3{font-size:15px; font-weight:500; color:var(--soluk); padding:0 20px 12px}
.serit{display:flex; gap:12px; overflow-x:auto; padding:0 20px 4px; scroll-snap-type:x mandatory; scroll-padding-inline:20px; scrollbar-width:none; touch-action:pan-x pan-y}
.serit::-webkit-scrollbar{display:none}
.vitrin{flex:none; width:min(72vw, 300px); scroll-snap-align:start; text-align:start; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
.vitrin .kadr{display:block; position:relative; aspect-ratio:4 / 5; border-radius:14px; overflow:hidden; background:var(--dolgu)}
.vitrin img{width:100%; height:100%; object-fit:cover}
.vitrin .oynat{position:absolute; inset-inline-start:12px; bottom:12px; height:30px; padding:0 11px 0 9px; border-radius:8px; display:flex; align-items:center; gap:6px;
  background:rgba(21,21,20,.62); color:#fff; font-size:13px; font-weight:500}
.vitrin .oynat .ph{font-size:14px}
.vitrin b{display:flex; justify-content:space-between; gap:12px; margin-top:10px; font-weight:500; font-size:17px}
.vitrin b span{font-variant-numeric:tabular-nums}
.vitrin small{display:block; color:var(--soluk); font-size:14.5px}
.bolum{padding:30px 20px 0}
.bolum h3{font-family:var(--baslik); font-size:22px; font-weight:600; letter-spacing:-.015em; padding-bottom:10px; border-bottom:1px solid var(--yazi)}
.urun{display:grid; grid-template-columns:76px 1fr auto; gap:3px 14px; padding:14px 0; border:0; border-bottom:1px solid var(--cizgi); width:100%;
  background:none; text-align:start; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:background-color 120ms}
.urun:active{background:var(--basili)}
.urun .kucuk{display:block; grid-row:1 / span 3; width:76px; height:76px; border-radius:12px; overflow:hidden; background:var(--dolgu); position:relative}
.urun .kucuk img{width:100%; height:100%; object-fit:cover}
.urun .kucuk i{position:absolute; inset-inline-end:5px; bottom:5px; width:22px; height:22px; border-radius:6px; background:rgba(21,21,20,.62); color:#fff; display:grid; place-items:center}
.urun .kucuk i .ph{font-size:12px}
.urun h4{font-size:17px; font-weight:500; line-height:1.3; letter-spacing:-.005em; align-self:start; padding-top:2px}
.fiyat{font-size:17px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:end; padding-top:2px}
/* fotoğrafsız ürün: aynı görseli tekrar eden menüden iyidir — yazı satırı, dokunulmaz */
.urun.yalin{grid-template-columns:1fr auto; cursor:default; padding:13px 0}
.urun.yalin:active{background:none}
.urun.yalin p, .urun.yalin .etiketler{grid-column:1 / 2}
.urun p{grid-column:2 / 3; color:var(--soluk); font-size:15px; line-height:1.4; text-wrap:pretty}
.urun p, .vitrin small{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden}
.etiketler{grid-column:2 / 3; display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:3px}
.etiket{font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--soluk)}
.etiket.sef{color:var(--vurgu-yazi)}
.etiket.tukendi{color:var(--kapali)}
/* alerjenler: Türk Gıda Kodeksi / AB'nin 14 alerjeni — listede tek satır, panelde de */
.alerjen{grid-column:2 / 3; font-size:13.5px; line-height:1.35; color:var(--soluk); margin-top:2px}
.alerjen b{font-weight:500}
.urun.yalin .alerjen{grid-column:1 / 2}
.u-govde .alerjen{margin-top:12px; font-size:15px}
.u-govde .alerjen:empty{display:none}
.bitti h4, .bitti .fiyat, .bitti p, .bitti .kucuk img, .bitti .kadr img{opacity:.5}
.gel{opacity:0; transform:scale(1.04); transition:opacity 500ms var(--cikis), transform 700ms var(--cikis)}
.gel.yuklendi{opacity:1; transform:none}
mark{background:none; color:inherit; box-shadow:inset 0 -.42em 0 var(--vurgu-acik); border-radius:2px}
.bos{display:none; padding:40px 20px; color:var(--soluk); text-align:center}
.bos.gorunur{display:block}
.m-not{padding:28px 20px 0; color:var(--soluk); font-size:14px; line-height:1.5}
.m-son{padding:20px 20px calc(28px + env(safe-area-inset-bottom)); color:var(--soluk); font-size:13.5px; display:flex; justify-content:space-between; gap:12px}

/* ── ürün yaprağı ── */
#urunYaprak .tutamac{position:absolute; top:0; left:0; right:0; z-index:3}
#urunYaprak .tutamac::before{background:color-mix(in srgb, var(--zemin) 90%, transparent); box-shadow:0 1px 3px rgba(21,21,20,.25)}
/* Genişlik hep tam; yükseklik = genişliğin ¾'ü ya da ekranın %46'sı (küçüğü).
   aspect-ratio + max-height kullanılmaz: yükseklik sınıra takılınca tarayıcı oranı korumak için
   GENİŞLİĞİ daraltıyordu (geniş ekranda sağda boş şerit, kapat düğmesi içeride). */
.u-medya{position:relative; flex:none; width:100%; height:min(calc(min(100vw, 560px) * .75), 46vh); height:min(calc(min(100vw, 560px) * .75), 46dvh);
  background:var(--dolgu); overflow:hidden; touch-action:none}
@supports not (aspect-ratio: 1){ .vitrin .kadr{height:min(90vw, 375px)} }
.u-medya img, .u-medya video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.u-medya video{opacity:0; transition:opacity 500ms var(--cikis)}
.u-medya video.hazir{opacity:1}
#u-gorsel{transition:filter 450ms var(--cikis)}
#u-gorsel.dusuk{filter:blur(8px)}
.u-medya.ucusta > *:not(.u-kapat){visibility:hidden}
.u-kapat{position:absolute; top:12px; inset-inline-end:12px; width:44px; height:44px; border-radius:12px; border:0; cursor:pointer; z-index:4;
  background:color-mix(in srgb, var(--zemin) 92%, transparent); display:grid; place-items:center}
.u-kapat .ph{font-size:20px}
.u-govde{flex:1 1 auto; min-height:0; padding:20px 20px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; overscroll-behavior:contain}
.u-govde .u-ust{display:flex; justify-content:space-between; align-items:baseline; gap:16px}
.u-govde h3{font-family:var(--baslik); font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.u-govde .fiyat{font-size:22px; font-weight:600}
.u-govde p{margin-top:8px; color:var(--soluk); font-size:16.5px}
.u-govde .etiketler{margin-top:12px}
.u-govde .kategori{margin-top:18px; padding-top:14px; border-top:1px solid var(--cizgi); color:var(--soluk); font-size:14.5px}
/* uçan görsel: küçük görselden panel görseline */
.ucan{position:fixed; left:0; top:0; z-index:60; overflow:hidden; pointer-events:none; transform-origin:0 0; will-change:transform, clip-path}
.ucan img{width:100%; height:100%; object-fit:cover}
</style>
