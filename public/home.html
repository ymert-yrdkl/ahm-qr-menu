<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AHM Cloud QR Menü</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Outfit:wght@500&display=swap">
<style>
  :root{color-scheme:light;--paper:#faf8f4;--ink:#1b1614;--muted:#736963;--line:#e7e1d7}
  *{box-sizing:border-box;border-radius:0}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:"DM Sans","Helvetica Neue",Arial,sans-serif}
  main{width:100%;max-width:520px;border-top:1px solid var(--ink);padding-top:24px}
  small{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  h1{margin:14px 0 0;font-family:"Outfit","DM Sans",sans-serif;font-weight:500;font-size:clamp(34px,9vw,48px);line-height:1.02;letter-spacing:-.04em}
  p{margin:16px 0 0;color:var(--muted)}
</style>
</head>
<body>
<main>
  <small>AHM Cloud · QR Menü</small>
  <h1>{{MESSAGE}}</h1>
  <p>Menüye ulaşmak için masanızdaki QR kodu okutun.</p>
</main>
</body>
</html>
