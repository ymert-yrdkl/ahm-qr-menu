<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="{{THEME_COLOR}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/menu.css?v={{V}}">
<style>:root{ {{THEME_VARS}} }</style>
</head>
<body class="{{BODY_CLASS}}" data-base="{{BASE}}">
<a class="skip" href="#menu">Menüye geç</a>

<header class="bar" id="top">
  <div class="wrap">
    <a class="brand" id="brand" href="#top"></a>
    <button class="icon-btn" type="button" id="search-open" aria-label="Menüde ara" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>
    </button>
  </div>
</header>

<nav class="cats" aria-label="Kategoriler" id="cats" hidden>
  <div class="wrap rail" id="rail"></div>
</nav>

<main class="wrap" id="menu">
  <noscript><p class="empty">Menüyü görmek için tarayıcınızda JavaScript açık olmalı.</p></noscript>
</main>

<footer class="wrap foot" id="foot"></footer>

<div class="dock" id="dock" hidden></div>

<section class="search" id="search" role="dialog" aria-modal="true" aria-label="Menüde ara" hidden>
  <div class="search-bar">
    <div class="wrap">
      <input type="search" id="search-input" placeholder="Ürün ara" autocomplete="off" enterkeyhint="search" aria-label="Ürün ara">
      <button class="icon-btn" type="button" id="search-close" aria-label="Aramayı kapat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>
  </div>
  <div class="search-body"><div class="wrap" id="search-results"></div></div>
</section>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script type="application/json" id="menu-data">{{DATA}}</script>
<script src="/assets/common.js?v={{V}}"></script>
<script src="/assets/menu.js?v={{V}}"></script>
</body>
</html>
